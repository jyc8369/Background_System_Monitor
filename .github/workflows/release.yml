name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: background-system-monitor-windows-x64
            binary_name: background-system-monitor-windows-x64.exe
            archive_extension: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: background-system-monitor-linux-x64
            binary_name: background-system-monitor-linux-x64
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: background-system-monitor-macos-x64
            binary_name: background-system-monitor-macos-x64
            archive_extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: background-system-monitor-macos-arm64
            binary_name: background-system-monitor-macos-arm64
            archive_extension: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = "target/${{ matrix.target }}/release/background_system_monitor.exe"
          $binary = "dist/${{ matrix.binary_name }}"
          Copy-Item -LiteralPath $source -Destination $binary
          Compress-Archive -Path $binary -DestinationPath "dist/${{ matrix.artifact_name }}.zip"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          source="target/${{ matrix.target }}/release/background_system_monitor"
          binary="dist/${{ matrix.binary_name }}"
          cp "$source" "$binary"
          tar -C dist -czf "dist/${{ matrix.artifact_name }}.tar.gz" "${{ matrix.binary_name }}"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print)
          test "${#assets[@]}" -eq 4
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
