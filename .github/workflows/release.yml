name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked -- --test-threads=1

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  verify-macos:
    name: Verify macOS runtime (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: Intel
          - os: macos-14
            target: aarch64-apple-darwin
            architecture: Apple Silicon
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run macOS tests
        run: cargo test --locked --target ${{ matrix.target }} -- --test-threads=1

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test native macOS API
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/background_system_monitor"
          "$binary" > macos-smoke.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health > health.json; then
              break
            fi
            sleep 1
          done

          test -s health.json
          python3 -c 'import json; data=json.load(open("health.json")); assert data["status"] == "OK"; assert data["name"] == "Background_System_Monitor"'
          curl --fail --silent --show-error http://127.0.0.1:3001/api/system > system.json
          python3 -c 'import json; data=json.load(open("system.json")); required=["index", "name", "vendor", "memory_total_bytes", "memory_used_bytes", "utilization_percent", "temperature_celsius", "power_watts"]; assert isinstance(data["gpus"], list); assert "package_temperature_celsius" in data["cpu"]; assert all(all(key in gpu for key in required) for gpu in data["gpus"])'
          curl --fail --silent --show-error --request POST http://127.0.0.1:3001/control/shutdown

  build:
    name: ${{ matrix.artifact_name }}
    needs: [verify, verify-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: background-system-monitor-windows-x64
            binary_name: background-system-monitor-windows-x64.exe
            archive_extension: zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: background-system-monitor-linux-x64
            binary_name: background-system-monitor-linux-x64
            archive_extension: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: background-system-monitor-macos-x64
            binary_name: background-system-monitor-macos-x64
            archive_extension: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: background-system-monitor-macos-arm64
            binary_name: background-system-monitor-macos-arm64
            archive_extension: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = "target/${{ matrix.target }}/release/background_system_monitor.exe"
          $binary = "dist/${{ matrix.binary_name }}"
          Copy-Item -LiteralPath $source -Destination $binary
          Compress-Archive -Path $binary -DestinationPath "dist/${{ matrix.artifact_name }}.zip"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          source="target/${{ matrix.target }}/release/background_system_monitor"
          binary="dist/${{ matrix.binary_name }}"
          cp "$source" "$binary"
          tar -C dist -czf "dist/${{ matrix.artifact_name }}.tar.gz" "${{ matrix.binary_name }}"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_extension }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print)
          test "${#assets[@]}" -eq 4
          gh release create "${GITHUB_REF_NAME}" \
            --repo "jyc8369/Background_System_Monitor" \
            "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
